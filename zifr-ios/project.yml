name: Zifr
options:
  bundleIdPrefix: com.vibing
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  xcodeVersion: "16"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    PRODUCT_BUNDLE_IDENTIFIER: com.vibing.miloom
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    INFOPLIST_FILE: Zifr/Info.plist
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_PREVIEWS: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.4.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 7.1.0
  LinkKit:
    url: https://github.com/plaid/plaid-link-ios-spm.git
    from: 6.4.0

targets:
  Zifr:
    type: application
    platform: iOS
    sources:
      - path: Zifr
    dependencies:
      - package: Supabase
      - package: GoogleSignIn
      - package: LinkKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibing.miloom
        INFOPLIST_FILE: Zifr/Info.plist
        CODE_SIGN_ENTITLEMENTS: Zifr/Zifr.entitlements
    scheme:
      testTargets: []

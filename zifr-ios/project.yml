name: Zifr
options:
  bundleIdPrefix: com.vibing
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  xcodeVersion: "16"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    PRODUCT_BUNDLE_IDENTIFIER: com.vibing.miloom
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    INFOPLIST_FILE: Zifr/Info.plist
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_PREVIEWS: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.4.0

targets:
  Zifr:
    type: application
    platform: iOS
    sources:
      - path: Zifr
    dependencies:
      - package: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibing.miloom
        INFOPLIST_FILE: Zifr/Info.plist
    scheme:
      testTargets: []

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Miloom Invitation</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        align-items: center;
        background: #1c1c1e;
        color: #fff;
        display: flex;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      main {
        background: rgba(0, 0, 0, 0.58);
        border: 1px solid rgba(193, 170, 120, 0.55);
        border-radius: 24px;
        max-width: 30rem;
        padding: 36px 28px;
      }
      .mark { color: #c1aa78; font-size: 28px; font-weight: 750; }
      h1 { font-size: 24px; margin: 22px 0 12px; }
      p { color: rgba(255, 255, 255, 0.68); line-height: 1.55; margin: 0; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">Miloom</div>
      <h1>Open Miloom to review this invitation</h1>
      <p>If Miloom did not open automatically, open the app on this device and choose Invitations in your Inbox. Invitation links expire after seven days.</p>
    </main>
  </body>
</html>

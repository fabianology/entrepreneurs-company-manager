<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Miloom</title>
    <meta name="description" content="Reset your Miloom account password securely.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .reset-container {
            max-width: 480px;
            margin: 140px auto 80px;
            padding: 40px;
            text-align: center;
        }
        .reset-header {
            margin-bottom: 30px;
        }
        .reset-header h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }
        .reset-header p {
            font-size: 1rem;
            color: var(--text-secondary);
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.6);
        }
        .form-group input {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            font-family: var(--font-main);
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--accent-blue);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
        }
        .submit-btn {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: var(--btn-primary);
            color: white;
            font-family: var(--font-main);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(138, 43, 226, 0.3);
        }
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #ef4444;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: none;
        }
        .success-state {
            display: none;
        }
        .success-icon {
            font-size: 4rem;
            color: #30D158;
            margin-bottom: 20px;
        }
        .success-state h2 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        .success-state p {
            color: var(--text-secondary);
            margin: 0 auto 30px;
        }
        .action-link {
            display: inline-block;
            padding: 14px 28px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .action-link:hover {
            background: white;
            color: black;
        }
        
        /* Spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            display: none;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="stars-bg"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <nav class="navbar glass">
        <a href="/" class="logo" style="color: var(--text-primary); text-decoration: none;">Miloom</a>
        <div class="nav-links">
            <a href="/">Home</a>
        </div>
    </nav>

    <main class="reset-container glass">
        <div id="reset-flow">
            <div class="reset-header">
                <h1>Reset Your <span class="gradient-text">Password</span></h1>
                <p>Configure a secure new password for your Miloom account.</p>
            </div>

            <div id="err-box" class="error-message"></div>

            <form id="reset-form">
                <div class="form-group">
                    <label for="password">New Password</label>
                    <input type="password" id="password" required minlength="8" placeholder="••••••••">
                </div>
                
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" required minlength="8" placeholder="••••••••">
                </div>

                <button type="submit" id="submit-btn" class="submit-btn">
                    <span class="spinner" id="btn-spinner"></span>
                    <span id="btn-text">Update Password</span>
                </button>
            </form>
        </div>

        <div id="success-flow" class="success-state">
            <div class="success-icon">✓</div>
            <h2>Password <span class="gradient-text">Updated</span></h2>
            <p>Your password has been changed successfully. You can now log back into the app using your new credentials.</p>
            <a href="miloom://" class="action-link">Open Miloom App</a>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('reset-form');
            const passwordInput = document.getElementById('password');
            const confirmInput = document.getElementById('confirm-password');
            const errBox = document.getElementById('err-box');
            const submitBtn = document.getElementById('submit-btn');
            const spinner = document.getElementById('btn-spinner');
            const btnText = document.getElementById('btn-text');
            const resetFlow = document.getElementById('reset-flow');
            const successFlow = document.getElementById('success-flow');

            // Parse access_token from the URL fragment (hash)
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const accessToken = params.get('access_token');
            const errorDesc = params.get('error_description');

            if (errorDesc) {
                showError("Link Error: " + decodeURIComponent(errorDesc.replace(/\+/g, ' ')));
                form.style.display = 'none';
            } else if (!accessToken) {
                showError("Invalid or expired password reset link. Please request a new link inside the Miloom mobile app.");
                form.style.display = 'none';
            }

            function showError(msg) {
                errBox.textContent = msg;
                errBox.style.display = 'block';
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errBox.style.display = 'none';

                const password = passwordInput.value;
                const confirmPassword = confirmInput.value;

                if (password !== confirmPassword) {
                    showError("Passwords do not match. Please check and try again.");
                    return;
                }

                // Show loading
                submitBtn.disabled = true;
                spinner.style.display = 'block';
                btnText.textContent = 'Updating...';

                try {
                    const response = await fetch("https://xxqdytdbpiqjilhutvhz.supabase.co/auth/v1/user", {
                        method: "PATCH",
                        headers: {
                            "apikey": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh4cWR5dGRicGlxamlsaHV0dmh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2MTYwMDMsImV4cCI6MjA5MzE5MjAwM30.LzjILfwR6mW4EcwG2e_f9Q9NNgc4mlpPV8qy537jYYw",
                            "Authorization": `Bearer ${accessToken}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ password: password })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.msg || data.message || "Failed to update password.");
                    }

                    // Success!
                    resetFlow.style.display = 'none';
                    successFlow.style.display = 'block';

                } catch (error) {
                    showError(error.message);
                    submitBtn.disabled = false;
                    spinner.style.display = 'none';
                    btnText.textContent = 'Update Password';
                }
            });
        });
    </script>
</body>
</html>

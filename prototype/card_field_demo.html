<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Card Number Field Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center}
.phone{width:390px;background:#171717;border-radius:44px;padding:60px 24px;border:2px solid #333;box-shadow:0 20px 60px rgba(0,0,0,.8)}
h2{font-size:22px;font-weight:800;margin-bottom:4px}
.sub{font-size:12px;color:rgba(255,255,255,.3);margin-bottom:32px}
.label{font-size:11px;font-weight:700;letter-spacing:.5px;color:rgba(255,255,255,.4);margin-bottom:6px}
.card-field{position:relative;margin-bottom:24px}
.card-input{width:100%;background:#111;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:0 16px 0 16px;height:56px;color:#fff;font-size:18px;font-weight:600;font-family:'Inter',sans-serif;outline:none;transition:border-color .3s,box-shadow .3s,padding-left .3s;letter-spacing:.5px}
.card-input:focus{border-color:rgba(255,255,255,.15)}
.card-input::placeholder{color:rgba(255,255,255,.15);font-weight:400;letter-spacing:0}
.card-input.detected{padding-left:60px;border-color:rgba(34,197,94,.35);box-shadow:0 0 12px rgba(34,197,94,.08)}
.logo-wrap{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:38px;height:26px;opacity:0;transition:opacity .35s ease;pointer-events:none;display:flex;align-items:center;justify-content:center}
.logo-wrap.show{opacity:1}
.logo-wrap svg{width:38px;height:26px}
.hint{font-size:11px;color:rgba(255,255,255,.2);margin-top:6px;margin-bottom:20px;font-weight:500;opacity:0;transition:opacity .3s}
.hint.show{opacity:1}
.demo-label{font-size:10px;font-weight:700;letter-spacing:1px;color:rgba(255,255,255,.12);text-align:center;margin-top:28px}
.try-row{display:flex;gap:8px;justify-content:center;margin-top:10px}
.try-btn{padding:8px 14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:10px;color:rgba(255,255,255,.35);font-size:11px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s}
.try-btn:hover{background:rgba(255,255,255,.08);color:#fff}
</style>
</head>
<body>
<div class="phone">
  <h2>Set up your Chase card</h2>
  <p class="sub">Fill in the basics — add more later.</p>

  <div class="label">CARD NUMBER</div>
  <div class="card-field">
    <div class="logo-wrap" id="logo"></div>
    <input class="card-input" id="num" placeholder="0000 0000 0000 0000" inputmode="numeric" oninput="detect(this)">
  </div>
  <div class="hint" id="hint"></div>

  <div class="demo-label">TRY THESE PREFIXES</div>
  <div class="try-row">
    <button class="try-btn" onclick="fill('4111222233334444')">4 — Visa</button>
    <button class="try-btn" onclick="fill('5200828282828210')">5 — Mastercard</button>
    <button class="try-btn" onclick="fill('378282246310005')">3 — Amex</button>
    <button class="try-btn" onclick="fill('6011111111111117')">6 — Discover</button>
  </div>
</div>

<script>
const logos={
  Visa:`<svg viewBox="0 0 48 32" fill="none"><rect width="48" height="32" rx="4" fill="#1a1f71"/><text x="24" y="21" text-anchor="middle" fill="#fff" font-family="Inter" font-weight="800" font-size="13" font-style="italic">VISA</text></svg>`,
  Mastercard:`<svg viewBox="0 0 48 32" fill="none"><rect width="48" height="32" rx="4" fill="#222"/><circle cx="19" cy="16" r="10" fill="#eb001b" opacity=".9"/><circle cx="29" cy="16" r="10" fill="#f79e1b" opacity=".9"/><path d="M24 8.5a10 10 0 000 15" fill="#ff5f00" opacity=".9"/></svg>`,
  Amex:`<svg viewBox="0 0 48 32" fill="none"><rect width="48" height="32" rx="4" fill="#006fcf"/><text x="24" y="18" text-anchor="middle" fill="#fff" font-family="Inter" font-weight="800" font-size="7.5">AMEX</text></svg>`,
  Discover:`<svg viewBox="0 0 48 32" fill="none"><rect width="48" height="32" rx="4" fill="#111"/><circle cx="28" cy="16" r="9" fill="#ff6000"/><text x="16" y="18" fill="#fff" font-family="Inter" font-weight="700" font-size="6.5">DISC</text></svg>`
};

function detect(el){
  let v=el.value.replace(/\D/g,''),f='';
  for(let i=0;i<v.length&&i<16;i++){if(i>0&&i%4===0)f+=' ';f+=v[i];}
  el.value=f;
  const lw=document.getElementById('logo'),h=document.getElementById('hint');
  let net=null;
  if(v.length>=1){
    if(v[0]==='4')net='Visa';
    else if(v[0]==='5')net='Mastercard';
    else if(v[0]==='3')net='Amex';
    else if(v[0]==='6')net='Discover';
  }
  if(net){
    lw.innerHTML=logos[net];lw.className='logo-wrap show';
    el.className='card-input detected';
    h.textContent=net+' detected';h.className='hint show';
  }else{
    lw.className='logo-wrap';el.className='card-input';h.className='hint';
  }
}

function fill(n){
  const el=document.getElementById('num');el.value='';
  let i=0;const id=setInterval(()=>{
    if(i>=n.length){clearInterval(id);return;}
    el.value+=n[i];i++;detect(el);
  },60);
}
</script>
</body>
</html>
